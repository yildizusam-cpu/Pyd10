body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif}

header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:18px 16px 6px;max-width:900px;margin:auto}

.bar{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}

.lessons small{display:block;color:var(--mute)}

<header>
  <h1>pyd<span>10</span></h1>
  <button class="btn ghost" id="theme" aria-label="Tema değiştir">Tema</button>

<p class="sub">110+ ders. Bir dil seç, hazır kodu gör, klavyeyle aynen yaz, hatalarından öğren.</p>

  <div class="lessons" id="langs"></div>
  <div class="lessons" id="list"></div>

  <div class="card">
    <h2 id="lt"></h2>
    <p id="ld"></p>
    <div id="target" tabindex="-1" aria-label="Yazılacak kod"></div>
    <div class="out hidden" id="outbox"></div>
    <textarea id="ta" placeholder="Kodu buraya yaz. Girinti için Tab tuşunu kullan." autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
    <div class="row">
      <button class="btn ghost" id="again">Baştan başla</button>
      <button class="btn ghost" id="hint">İpucu: çıktıyı göster</button>
    </div>
  </div>

  <div class="card" id="res">
    <h2 id="rt"></h2>
    <p id="rm"></p>
    <div class="row"><button class="btn" id="next">Sonraki ders</button><button class="btn ghost" id="retry">Tekrar yaz</button></div>
  </div>

  <div class="card">
    <h2>Seni geliştiren bölüm</h2>
    <p>Sık yanlış bastığın tuşlar:</p>
    <div class="weak" id="weak"></div>
    <div class="row"><button class="btn" id="drill">Zayıf tuş antrenmanı yap</button></div>
  </div>

  <div class="card">
    <h2>Kendi kodunu ekle</h2>
    <p>Beğendiğin bir kodu yapıştır, sonra onu yazarak çalış.</p>

    <div class="row"><button class="btn ghost" id="addMine">Derse ekle</button><button class="btn ghost" id="reset">İlerlemeyi sıfırla</button></div>
  </div>
</main>

var S={done:{},weak:{},custom:[],lang:0};
try{var r=localStorage.getItem('pyd10');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem('pyd10',JSON.stringify(S))}catch(e){}}
var $=function(i){return document.getElementById(i)};
var li=Math.min(S.lang||0,LANGS.length-1),cur=null,curId=0,start=0,total=0,errs=0,prev=0,finished=false;
function lessons(){return LANGS[li].l}
function all(){return lessons().concat(S.custom.filter(function(c){return c.g===LANGS[li].id}))}
function key(i){return LANGS[li].id+':'+i}
function stars(a){return a>=95?'★★★':a>=85?'★★☆':'★☆☆'}
function renderLangs(){
  var box=$('langs');box.innerHTML='';
  LANGS.forEach(function(g,i){
    var b=document.createElement('button');b.textContent=g.n;if(i===li)b.className='on';
    b.onclick=function(){li=i;S.lang=i;save();renderLangs();openLesson(0)};box.appendChild(b);
  });
}
function renderList(){
  var box=$('list');box.innerHTML='';var n=0,base=lessons().length;
  all().forEach(function(l,i){
    var b=document.createElement('button');
    var d=S.done[key(i)];if(d&&i<base)n++;
    var open=i===0||i>=base||S.done[key(i-1)];
    b.disabled=!open;if(i===curId)b.className='on';
    b.innerHTML=(i<base?(i+1)+'. ':'+ ')+l.t+'<small>'+(d?stars(d.acc)+' '+d.acc+'%':open?'Hazır':'Kilitli')+'</small>';
    b.onclick=function(){openLesson(i)};box.appendChild(b);
  });
  $('sDone').textContent=n+'/'+base;
  renderWeak();
}
function renderWeak(){
  var arr=Object.keys(S.weak).sort(function(a,b){return S.weak[b]-S.weak[a]}).slice(0,6);
  var w=$('weak');w.innerHTML='';
  if(!arr.length){w.textContent='Henüz hata yok. Devam et!';return}
  arr.forEach(function(k){var s=document.createElement('span');s.textContent=k==='\n'?'Enter':k===' '?'boşluk':k;w.appendChild(s)});
}
function openLesson(i,obj){
  curId=i;cur=obj||all()[i];
  $('lt').textContent=cur.t;$('ld').textContent=cur.d;
  $('outbox').textContent='Çıktı:\n'+(cur.o||'(çalıştırınca görürsün)');
  $('outbox').classList.add('hidden');$('res').style.display='none';
  $('ta').value='';start=0;total=0;errs=0;prev=0;finished=false;
  $('sWpm').textContent='0';$('sAcc').textContent='100%';
  drawTarget();renderList();$('ta').focus({preventScroll:true});
}
function drawTarget(){
  var t=cur.c,v=$('ta').value,box=$('target');box.innerHTML='';
  for(var i=0;i<t.length;i++){
    var s=document.createElement('span'),ch=t[i];
    s.textContent=ch==='\n'?'↵\n':ch;
    if(i<v.length)s.className=v[i]===ch?'c':'w';
    else if(i===v.length)s.className='cur';
    else s.className='p';
    box.appendChild(s);
  }
}
function onInput(){
  if(finished)return;
  var v=$('ta').value;
  if(!start&&v.length)start=Date.now();
  for(var j=prev;j<v.length;j++){
    total++;
    if(v[j]!==cur.c[j]){errs++;var k=cur.c[j]||'?';S.weak[k]=(S.weak[k]||0)+1}
  }
  prev=v.length;
  drawTarget();
  var acc=total?Math.round((total-errs)/total*100):100;
  $('sAcc').textContent=acc+'%';
  var m=(Date.now()-start)/60000;
  if(m>0)$('sWpm').textContent=Math.round(v.length/5/m);
  if(v===cur.c)finish(acc,m);
}
function finish(acc,m){
  finished=true;var base=lessons().length;
  var wpm=Math.max(1,Math.round(cur.c.length/5/Math.max(m,0.01)));
  $('sWpm').textContent=wpm;
  var best=S.done[key(curId)];
  if(curId<base&&(!best||acc>=best.acc))S.done[key(curId)]={acc:acc,wpm:wpm};
  save();
  $('outbox').classList.remove('hidden');
  var ok=acc>=85,r=$('res');r.style.display='block';
  $('rt').textContent=(ok?'Tebrikler! ':'Az kaldı. ')+stars(acc);
  var msg='Doğruluk %'+acc+', hız '+wpm+' kelime/dk. ';
  if(ok)msg+=curId<base-1?'Sıradaki ders açıldı.':'Bu bölümü bitirdin! Üstteki listeden başka bir dil seçebilirsin.';
  else msg+='Sonraki derse geçmek için %85 gerekir. "Zayıf tuş antrenmanı" ile çalışıp tekrar dene.';
  $('rm').textContent=msg;
  $('next').style.display=ok&&curId<base-1?'inline-block':'none';
  renderList();r.scrollIntoView({behavior:'smooth',block:'nearest'});
}
$('ta').addEventListener('input',onInput);
$('ta').addEventListener('paste',function(e){e.preventDefault()});
$('ta').addEventListener('keydown',function(e){
  if(e.key==='Tab'){e.preventDefault();this.setRangeText('    ',this.selectionStart,this.selectionEnd,'end');onInput()}
});
$('target').onclick=function(){$('ta').focus()};
$('again').onclick=$('retry').onclick=function(){openLesson(curId,cur)};
$('hint').onclick=function(){$('outbox').classList.toggle('hidden')};
$('next').onclick=function(){openLesson(curId+1)};
function score(t,keys){var s=0;keys.forEach(function(k){s+=t.split(k).length-1});return s}
$('drill').onclick=function(){
  var keys=Object.keys(S.weak).sort(function(a,b){return S.weak[b]-S.weak[a]}).slice(0,4);
  if(!keys.length){alert('Önce bir ders yaz; hatalarına göre antrenman hazırlarım.');return}
  var lines=[];
  lessons().forEach(function(l){l.c.split('\n').forEach(function(x){
    var t=x.trim();if(t&&lines.indexOf(t)<0&&keys.some(function(k){return k!=='\n'&&k!==' '&&t.indexOf(k)>-1}))lines.push(t)})});
  lines=lines.sort(function(a,b){return score(b,keys)-score(a,keys)}).slice(0,4);
  if(!lines.length)lines=['pyd 10'];
  openLesson(curId,{t:'Zayıf tuş antrenmanı',d:'Bu satırlar en çok yanlış bastığın tuşları içeriyor.',c:lines.join('\n'),o:'(antrenman)'});
};
$('addMine').onclick=function(){
  var v=$('mine').value.replace(/\s+$/,'');
  if(!v){alert('Önce bir kod yaz veya yapıştır.');return}
  S.custom.push({g:LANGS[li].id,t:'Kodum '+(all().length-lessons().length+1),d:'Kendi eklediğin kod.',c:v,o:''});save();
  $('mine').value='';openLesson(all().length-1);
};
$('reset').onclick=function(){if(confirm('Tüm ilerleme silinsin mi?')){S={done:{},weak:{},custom:[],lang:li};save();openLesson(0)}};
$('theme').onclick=function(){
  var d=document.documentElement,dark=getComputedStyle(d).getPropertyValue('--bg').trim()==='#0d1a24';
  d.setAttribute('data-theme',dark?'light':'dark');
};
renderLangs();openLesson(0);
</script>
